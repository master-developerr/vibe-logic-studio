name: Trigger Vercel Production Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Vercel Deploy Hook
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel Deploy Hook
        run: |
          response=$(curl -s -X POST "https://api.vercel.com/v1/integrations/deploy/prj_gNjhebjfszrZfFk167JM7D44UObK/eKmZf81abT")
          echo "Vercel Deploy Response: $response"
